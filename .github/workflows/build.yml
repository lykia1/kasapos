name: Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle (tek dosya exe)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/KasaPos/KasaPos.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version=0.4.${{ github.run_number }} -o out 2>&1 | tee build.log

      - name: Paketle
        shell: pwsh
        run: |
          Compress-Archive -Path out/KasaPOS.exe -DestinationPath KasaPOS-v0.4.${{ github.run_number }}.zip

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: KasaPOS v0.4.${{ github.run_number }}
          body: |
            Otomatik derleme. Kurulum: zip içindeki KasaPOS.exe'yi masaüstüne çıkar ve çalıştır.
            Windows "bilgisayarınız korundu" uyarısı verirse "Ek bilgi" > "Yine de çalıştır".
          files: |
            KasaPOS-v0.4.${{ github.run_number }}.zip
            out/KasaPOS.exe

      - name: Derleme kaydını ci-log dalına yaz
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          {
            echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}"
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -E "error|Error" "$GITHUB_WORKSPACE/build.log" | sed 's#.*src/KasaPos/#src/KasaPos/#' | sort -u | head -150
              echo '--- tail ---'
              tail -40 "$GITHUB_WORKSPACE/build.log"
            fi
          } > status.txt
          git init -q
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-log
          git add status.txt && git commit -qm "run ${{ github.run_number }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Hata kaydı (issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Derleme #${{ github.run_number }} başarısız."
            echo '```'
            if [ -f build.log ]; then grep -E "error|Error" build.log | sed 's#.*src/KasaPos/#src/KasaPos/#' | sort -u | head -120; fi
            echo '```'
          } > err.md
          gh issue create --repo "${{ github.repository }}" --title "Derleme hatası #${{ github.run_number }}" --body-file err.md
