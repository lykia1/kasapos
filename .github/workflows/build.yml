name: Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  APPVER: 0.10.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle (tek dosya exe)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/KasaPos/KasaPos.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version=$APPVER -o out 2>&1 | tee build.log

      - name: Lisans üreticiyi derle
        shell: bash
        run: |
          set -o pipefail
          dotnet publish tools/LisansUretici/LisansUretici.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-tool 2>&1 | tee -a build.log

      - name: Kurulum programını oluştur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\KasaPOS.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { Get-Content iscc.log | Add-Content build.log; exit 1 }
          Compress-Archive -Path out-tool/KasaPOS-LisansUretici.exe -DestinationPath dist/KasaPOS-LisansUretici.zip

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APPVER }}
          name: KasaPOS v${{ env.APPVER }}
          body: |
            **Kurulum:** KasaPOS-Setup-${{ env.APPVER }}.exe dosyasını indirip çalıştır. Masaüstüne kısayol ekler; sonraki sürümler program içinden otomatik güncellenir.
            **Kurulumsuz kullanım:** KasaPOS.exe'yi indirip doğrudan çalıştırabilirsin.
            Windows "bilgisayarınız korundu" uyarısı verirse "Ek bilgi" > "Yine de çalıştır".
          files: |
            dist/KasaPOS-Setup-${{ env.APPVER }}.exe
            out/KasaPOS.exe
            dist/KasaPOS-LisansUretici.zip

      - name: Hata kaydı (issue)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Derleme #${{ github.run_number }} başarısız."
            echo '```'
            if [ -f build.log ]; then grep -E "error|Error" build.log | sed 's#.*src/KasaPos/#src/KasaPos/#' | sort -u | head -120; echo '--- son satırlar ---'; tail -30 build.log; fi
            echo '```'
          } > err.md
          gh issue create --repo "${{ github.repository }}" --title "Derleme hatası #${{ github.run_number }}" --body-file err.md
